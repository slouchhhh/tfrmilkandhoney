 news.2004.t: "Hamas Coups Palestinian Authority"
 news.2004.d: "In a swift, meticulously coordinated coup across Ramallah and the major urban centers of the West Bank, Hamas militants and aligned security factions have forcefully dismantled the Palestinian Authority apparatus.\n\nPresident Mahmoud Abbas, who has ruled the West Bank via presidential decrees since the original 2007 factional split, has been formally deposed and placed under house arrest by the arriving militant forces. In his place, Hamas political bureau chief Ismail Haniyeh has been declared the unified President of the State of Palestine, effectively consolidating the administrations of both the Gaza Strip and the West Bank under a single political authority.\n\nImmediately following the takeover, Haniyeh issued a sweeping executive order permanently dissolving the long-dormant Palestinian Legislative Council and suspending the basic constitutional frameworks. The new regime has declared that all legislative and executive authority will now be centralized under a transitional revolutionary council, effectively neutralizing the remnants of the Fatah political establishment."
 news.2004.a: "They got tired of pragmatism."
 