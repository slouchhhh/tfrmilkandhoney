 ###EVENTS###

 news.2001.t: "Syria Launches an Offensive Against Rojava"
 news.2001.d: "Capitalizing on the unprecedented domestic paralysis gripping Washington and Riyadh, President Bashar al-Assad has ordered the Syrian Arab Army (SAA) to launch a massive, multi-front offensive targeting the Autonomous Administration of Rojava east of the Euphrates River.\n\nFor years, the Kurdish-led Syrian Democratic Forces (SDF) relied on the physical presence of American military outposts, however, with the United States rapidly descending into riots, the American chain of command has been completely decapitated, leaving local US garrisons isolated, without orders, and actively packing up to return across the Atlantic.\n\nSensing vulnerability, SAA mechanized divisions, supported by local Arab tribal militias, have breached the lines of demarcation at Deir ez-Zor and Raqqa. The offensive has met with rapid early success, as under-equipped Kurdish units, stripped of western satellite intelligence and air cover, find themselves heavily outgunned by government artillery.\n\nAs Damascus forces rapidly advance toward the oil fields of al-Omar and the grain infrastructure of the northeast, the political leadership in Qamishli has issued a desperate plea for international mediation.\n\nWhile a complete collapse of Rojava appears increasingly imminent, military analysts note that the campaign is far from over. SAA commanders must now secure vast stretches of hostile territory, a logistical nightmare that could easily backfire if Kurdish forces pivot to a protracted guerrilla insurgency across the Syrian desert."
 news.2001.a: "Syria is doing something."
 news.2002.t: "The Syrian Civil War Ends"
 news.2002.d: "The Syrian Civil War, a decade-long conflict that fractured the Levant and reshaped global geopolitics, has come to a definitive and staggering conclusion. In a historic broadcast from Damascus, the Syrian Armed Forces announced the unconditional surrender of the final Hay'at Tahrir al-Sham (HTS) strongholds in Idlib, marking the total restoration of government control over the nation's major urban centers.\n\nThe final collapse of the armed opposition follows the swift and brutal unraveling of the Autonomous Administration of Rojava to the east. With Kurdish forces completely broken and their territory re-absorbed by the state, President Bashar al-Assad was able to pivot the entire weight of the veteran Syrian Arab Army westward, launching a massive, unyielding offensive that completely overwhelmed the remaining pockets of the Free Syrian Army (FSA).\n\nCut off from foreign supply lines and facing absolute encirclement, the leadership of HTS in Idlib signed a total capitulation agreement to prevent the complete annihilation of their remaining forces. Across the northern frontiers, the scattered remnants of the Turkish-backed FSA have laid down their weapons or fled across the border.\n\nFor the Ba'athist regime, the survival and reunification of the state stands as a monumental triumph, achieved against staggering odds and at an immense human and economic cost.\n\nHowever, international observers warn that while the conventional war has ended, the peace remains deeply fragile. Assad now inherits a devastated landscape of a shattered economy, and a deeply scarred population, meaning the regime's focus must immediately shift from military dominance to the monumental task of reconstruction before new insurgencies can take root."
 news.2002.a: "The bloodshed is over."
 news.2003.t: "Turkey Withdraws From Syria"
 news.2003.d: "The Turkish General Staff has announced a complete military withdrawal from northern Syria, formally ending years of cross-border operations. The decision follows the total collapse of the Syrian armed opposition, a reality that has fundamentally altered Ankara's strategic ambitions along its southern frontier.\n\nFor years, Turkish forces maintained a sprawling security zone to contain hostile militias and curb the refugee crisis. However, with Damascus successfully re-establishing absolute control, Turkish policymakers have recognized that a continued, isolated military presence risks a catastrophic, direct confrontation with a fully reunified Syrian Arab Army.\n\nUnder the terms of a newly brokered regional agreement, Turkish mechanized units have begun dismantling observation posts and withdrawing heavy armor back across the border. Control of the vital frontier gates and infrastructure is being rapidly transferred to regular Syrian government border guards, marking the first time in over a decade that Damascus has held these positions.\n\nWhile the withdrawal removes a massive obstacle to regional peace, military intelligence analysts warn that the border remains a highly volatile flashpoint. The sudden departure of Turkish troops leaves a security vacuum that Damascus must quickly secure, as thousands of bitter, disarmed former rebels remain packed along the frontier under the watchful eye of the Syrian military."
 news.2003.a: "Syria is reunited."

