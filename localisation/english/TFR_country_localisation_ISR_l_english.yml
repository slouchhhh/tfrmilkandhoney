 israel.12345.t: "The Second Arab-Israeli War"
 israel.12345.d: "The State of Israel has once again found itself at war with its Arab neighbors. The Arab Coalition appears to have seen weakness in Israel after the second American Civil War.\n\nFollowing a series of border skirmishes and escalating tensions, a full-scale conflict has erupted, drawing in multiple nations from the region. The Israeli Defense Forces (IDF) have mobilized rapidly, preparing to defend the nation's sovereignty and security against coordinated attacks from surrounding Arab states.\n\nThe international community watches closely as the situation unfolds, with calls for ceasefires and diplomatic interventions growing louder. However, the realities on the ground suggest that this conflict may be prolonged and intense, with significant implications for regional stability."
 israel.12345.a: "Here we go again..."
 israel.12346.t: "Egypt Leaves the War"
 israel.12346.d: ""
 israel.12346.a: "An unexpected outcome"
 israel.1.t: "Bibi's Trial Delayed"
 israel.1.d: "The halls of the Knesset have transformed into a fortress against justice as Benjamin Netanyahu formalizes his bid for parliamentary immunity. Following his formal indictment by Attorney General Avichai Mandelblit on charges of bribery, fraud, and breach of trust, the Prime Minister has turned to Speaker Yuli Edelstein to trigger a statutory shield.\n\nThe move has successfully halted the scheduled progression toward a Jerusalem District Court trial. Opposition leaders like Benny Gantz and Avigdor Lieberman have condemned the maneuver, pointing out that because the relevant Knesset committees remain unformed, the entire legal apparatus is locked in a state of suspension.\n\nFor now, the courtroom remains empty and the actual trial has yet to take place. The fate of the charges hinges entirely on whether a legislative majority can be secured to uphold the immunity, leaving the state's highest judicial crisis completely unresolved."
 israel.1.a: "This has bought us time..."
 israel.3.t: "State of Emergency"
 israel.3.d: "The United States, Israel's ultimate geopolitical guarantor, has fractured into absolute chaos as the Second American Civil War erupts. With Washington out of the play and the American nuclear umbrella effectively dissolved, a vacuum has opened in the Middle East, one that Israel's regional adversaries are preparing to exploit.\n\nIntelligence briefs from the IDF General Staff paint a similar picture, as satellite imagery reveals coordinated Arab troop movements along the Syrian and Egyptian frontiers. Sensing total American paralysis, neighboring regimes are rapidly mobilizing, positioning vast armor and mechanized divisions in a clear prelude to a localized, multi-front invasion.\n\nIn a dramatic, late-night televised address, Benjamin Netanyahu has bypassed standard legislative procedures to declare a sweeping National State of Emergency. Citing the existential threat of an unprovoked regional war and the collapse of American backing, the Prime Minister has enacted sweeping emergency decrees that effectively freeze the Knesset and strip the presidency of its constitutional oversight."
 israel.3.a: "War will come to Israel soon..."
