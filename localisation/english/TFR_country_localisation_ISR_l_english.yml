 POLITICS_REUVEN_RIVLIN_DESC: "Born into a prominent Jerusalem family with deep roots in the city, Rivlin built his decades-long career within the right-wing Likud party. He served as a Member of the Knesset and twice as its Speaker, earning a reputation for fierce independence and a strict adherence to parliamentary protocol. Despite his staunch right-wing ideological opposition to a Palestinian state, his unwavering defense of minority rights and democratic institutions paved his path to the presidency in 2014. Stepping into a ceremonial role, he transformed the office into a platform for civic bridge-building.\n\nIn sharp contrast to the polarizing rhetoric dominating the political landscape, Rivlin's presidency is defined by his "Four Tribes" speech, which warned against the growing chasm between secular Jews, national religious Jews, Ultra-Orthodox Jews, and Arab Israelis. His supporters revere him as a compassionate figure, the "president of all citizens,” who uses his authority to protect the rule of law and champion co-existence. His critics on the political right, however, view him with suspicion, occasionally labeling his calls for inclusivity as a betrayal of nationalist principles, while some on the left argue his rhetoric cannot bridge the fundamental systemic inequalities he overlooks. Nevertheless, as the country weathers unprecedented political instability, Rivlin remains a rare institutional anchor trying to hold the pieces together."

 #FLAVOR EVENTS
 israel.9901.t:0 "A Photograph in the Helmet" 
 israel.9901.d:0 "The desert night was cold enough to make the rifle metal sting against bare fingers. Somewhere beyond the perimeter, artillery rumbled faintly like distant thunder.\n\nPrivate Eyal sat against a concrete barrier, staring at a worn photograph tucked inside his helmet cover. Tel Aviv beach. Summer sunlight. Her smile.\n\n\"You keep looking at that thing, it'll start talking back,\" an older voice muttered.\n\nEyal glanced up as his commanding officer lowered himself beside him with a grunt. The captain looked exhausted, dark circles beneath his eyes carved deep from too many sleepless weeks.\n\n\"Sir...\" Eyal began awkwardly.\n\nThe officer waved him off. \"Relax. Everyone out here misses someone.\" He pulled a cigarette from his pocket, then thought better of it and shoved it back in.\n\nFor a moment, neither of them spoke.\n\n\"You know what keeps soldiers alive?\" the captain finally asked.\n\nEyal hesitated. \"Training?\"\n\n\"No,\" the officer replied quietly. \"Having a reason to go home.\"\n\nThe older man stood, adjusting the sling on his rifle before giving the young soldier a firm pat on the shoulder.\n\n\"So when this is over,\" he said, \"don't waste time sitting in uniform looking dramatic. Take her somewhere expensive.\"" 
 israel.9901.a:0 "We all fight to return home."

 israel.9902.t:0 "Blue and White" 
 israel.9902.d:0 "Israeli politics has always resembled a knife fight held inside a crowded bus. Coalitions collapse overnight, ministers trade accusations before breakfast, and every election is declared \"historic\" by men who said the same thing six months earlier.\n\nInto this chaos steps Benny Gantz.\n\nThe former Chief of Staff has spent weeks shuttling between party offices, military acquaintances, and exhausted political operatives in an effort to construct something rare in modern Israel: a bloc broad enough to survive contact with reality.\n\nUnder the banner of §CBlue and White§!, centrists, liberals, and security-minded moderates gather beneath a carefully managed image of competence and national unity. Supporters describe the alliance as a stabilizing force for a country trapped between internal division and regional collapse.\n\nCritics call it an alliance held together by PowerPoint presentations and mutual dislike of everyone else.\n\nStill, as cameras flash and reporters crowd around the podium, Gantz adjusts his tie and delivers the simple message his advisors spent days rehearsing:\n\n\"Israel deserves a government that remembers how to breathe before it learns how to shout.\"\n\nFor a brief moment, even the Knesset falls quiet." 
 israel.9902.a:0 "A center strong enough to hold."

 israel.9903.t:0 "Death Toll Reports" 
 israel.9903.d:0 "The Ministry of Health updated the numbers shortly after dawn.\n\nTwenty-one dead.\n\nNot soldiers. Not politicians. Not men whose faces would appear on posters or television broadcasts. Just ordinary people scattered across the country like dropped coins.\n\nA teacher from Haifa.\nA mechanic from Ashdod.\nA grandmother in Jerusalem whose family was only allowed to say goodbye through a phone screen.\n\nHospitals continue operating beneath fluorescent lights that never seem to switch off anymore. Nurses move through crowded hallways with masks cutting red lines into exhausted faces while reporters debate infection curves beside colorful graphics.\n\nOutside, traffic still crawls through Tel Aviv. Cafés still serve coffee. Arguments still erupt in the Knesset.\n\nThe country keeps moving because countries always do.\n\nBut for twenty-one families tonight, the world has stopped completely." 
 israel.9903.a:0 "Stop this madness..."